global:
  scrape_interval: 15s # Frequência de coleta de métricas

scrape_configs:
  - job_name: 'streamflow-services'
    static_configs:
      - targets:
          - 'gateway:8080'
          - 'auth-service:3001'
          - 'catalog-service:3002'
          - 'streaming-service:3003'
          - 'recommendation-service:3004'
          - 'billing-service:3006'
    metrics_path: '/metrics' # Endpoint onde os serviços expõem as métricas